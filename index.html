<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PTCB Top 200 Drugs Study Tool</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
    --surface: #ffffff;
    --surface2: #f1f5f9;
    --border: #e2e8f0;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --text-light: #94a3b8;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --accent-bg: #eff6ff;
    --success: #10b981;
    --success-bg: #d1fae5;
    --danger: #ef4444;
    --danger-bg: #fee2e2;
    --warning: #f59e0b;
    --warning-bg: #fef3c7;
    --radius-lg: 16px;
    --radius-md: 12px;
    --radius-sm: 8px;
    --shadow-soft: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; overflow-x: hidden; }

  .app-container { display: flex; min-height: 100vh; }
  
  .sidebar {
    width: 260px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 2rem 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    position: fixed;
    height: 100vh;
    box-shadow: var(--shadow-soft);
    z-index: 10;
  }
  
  .main-content { margin-left: 260px; flex: 1; padding: 2.5rem; max-width: 1200px; }

  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 2rem; }
  .brand-icon { font-size: 24px; background: var(--accent); padding: 8px; border-radius: var(--radius-md); color: white; box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3); }
  .brand-title { font-size: 18px; font-weight: 700; color: var(--text-main); }
  .brand-subtitle { font-size: 12px; color: var(--text-muted); font-family: 'Fira Code', monospace; }

  .nav-header { font-size: 11px; font-weight: 700; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 1rem; padding-bottom: 0.5rem; }
  .nav-btn { display: flex; align-items: center; gap: 12px; padding: 0.75rem 1rem; border-radius: var(--radius-md); border: none; background: transparent; color: var(--text-muted); cursor: pointer; font-size: 14px; font-weight: 500; transition: all 0.2s; width: 100%; text-align: left; }
  .nav-btn:hover { background: var(--surface2); color: var(--text-main); }
  .nav-btn.active { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
  .nav-btn .count { margin-left: auto; font-family: 'Fira Code', monospace; font-size: 11px; background: rgba(0,0,0,0.05); padding: 2px 8px; border-radius: 99px; }

  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.5rem; box-shadow: var(--shadow-soft); }
  .stat-value { font-size: 32px; font-weight: 700; font-family: 'Fira Code', monospace; color: var(--text-main); }
  .stat-label { font-size: 13px; color: var(--text-muted); margin-top: 4px; font-weight: 500; }
  .progress-track { height: 6px; background: var(--surface2); border-radius: 99px; margin-top: 12px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); transition: width 0.8s ease; }

  .page-header { margin-bottom: 2rem; }
  .page-title { font-size: 28px; font-weight: 700; color: var(--text-main); }
  .page-desc { font-size: 15px; color: var(--text-muted); }

  .control-panel { background: var(--surface); padding: 1rem; border-radius: var(--radius-lg); border: 1px solid var(--border); margin-bottom: 1.5rem; display: flex; gap: 12px; flex-wrap: wrap; }
  .input-elem { padding: 0.6rem 1rem; border-radius: var(--radius-md); border: 1px solid var(--border); background: var(--surface2); font-size: 14px; flex: 1; min-width: 180px; }
  
  .btn { padding: 0.6rem 1.2rem; border-radius: var(--radius-md); border: none; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px; }
  .btn-primary { background: var(--accent); color: white; }
  .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-main); }
  
  /* Quiz Styling Fixes */
  .quiz-container { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 2.5rem; box-shadow: var(--shadow-soft); }
  .question-text { font-size: 22px; font-weight: 600; margin-bottom: 2rem; min-height: 60px; }
  
  /* Updated Grid: Strict 2 on top, 2 on bottom on wider screens */
  .options-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; width: 100%; }
  .option-btn { 
    padding: 1.25rem; 
    border-radius: var(--radius-md); 
    border: 2px solid var(--border); 
    background: var(--surface); 
    color: var(--text-main); 
    font-size: 15px; 
    cursor: pointer; 
    text-align: left; 
    transition: all 0.2s;
    min-height: 80px; 
    display: flex;
    align-items: center;
    word-break: break-word;
  }
  .option-btn:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-bg); }
  .option-btn.correct { background: var(--success-bg); border-color: var(--success); color: #065f46; }
  .option-btn.wrong { background: var(--danger-bg); border-color: var(--danger); color: #991b1b; }

  /* Explanation Block */
  .explanation-box { margin-top: 1.5rem; padding: 1.25rem; border-radius: var(--radius-md); border-left: 4px solid var(--accent); background: var(--surface2); }
  .explanation-box.correct-wrap { border-left-color: var(--success); background: var(--success-bg); color: #065f46; }
  .explanation-box.wrong-wrap { border-left-color: var(--danger); background: var(--danger-bg); color: #991b1b; }
  .explanation-title { font-weight: 700; margin-bottom: 4px; font-size: 15px; }
  .explanation-text { font-size: 14px; line-height: 1.5; }

  /* Lexicon Styling */
  .lexicon-layout { display: flex; gap: 1.5rem; height: 600px; }
  .lexicon-list { width: 35%; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow-y: auto; }
  .lexicon-item { padding: 1rem; border-bottom: 1px solid var(--border); cursor: pointer; }
  .lexicon-item.active { background: var(--accent-bg); border-left: 4px solid var(--accent); }
  .lexicon-detail { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 2.5rem; overflow-y: auto; }
  
  .detail-tag { display: inline-block; padding: 6px 12px; border-radius: 99px; font-size: 12px; font-weight: 600; margin-right: 8px; margin-bottom: 1rem; }
  .tag-class { background: var(--accent-bg); color: var(--accent); }
  .info-box { background: var(--warning-bg); border-left: 4px solid var(--warning); padding: 1.25rem; border-radius: 0 var(--radius-md) var(--radius-md) 0; margin-top: 2rem; }

  .hidden { display: none !important; }
  
  @media (max-width: 900px) {
    .sidebar { width: 70px; padding: 1rem 0.5rem; }
    .brand-title, .brand-subtitle, .nav-header, .nav-btn span:not(.count) { display: none; }
    .main-content { margin-left: 70px; padding: 1.5rem; }
    .options-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="app-container">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon">💊</div>
      <div>
        <div class="brand-title">RxMaster</div>
        <div class="brand-subtitle">PTCB Top 200 Core</div>
      </div>
    </div>
    <div class="nav-header">Practice</div>
    <button class="nav-btn active" onclick="switchTab('quiz', this)">🎯 Quick Quiz <span class="count" id="nav-quiz-cnt">0</span></button>
    <div class="nav-header">Knowledge Base</div>
    <button class="nav-btn" onclick="switchTab('lexicon', this)">📖 Drug Lexicon</button>
  </aside>

  <main class="main-content">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="stat-seen">0</div>
        <div class="stat-label">Drugs Encountered</div>
        <div class="progress-track"><div class="progress-fill" id="bar-seen" style="width: 0%"></div></div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-acc">0%</div>
        <div class="stat-label">Overall Accuracy</div>
        <div class="progress-track"><div class="progress-fill" id="bar-acc" style="width: 0%; background: var(--success);"></div></div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-streak">0</div>
        <div class="stat-label">Current Streak 🔥</div>
        <div class="progress-track"><div class="progress-fill" id="bar-streak" style="width: 0%; background: var(--warning);"></div></div>
      </div>
    </div>

    <div id="tab-quiz" class="tab-content">
      <div class="page-header">
        <h1 class="page-title">Quick Quiz</h1>
        <p class="page-desc">Test your knowledge across multiple formats.</p>
      </div>
      
      <div class="control-panel">
        <select class="input-elem" id="filter-mode" onchange="loadQuestion()">
          <option value="g2u">Generic Name → Primary Use</option>
          <option value="b2g">Brand Name → Generic Name</option>
          <option value="u2g">Primary Use → Generic Name</option>
          <option value="c2d">Drug Class → Generic Name</option>
        </select>
        <select class="input-elem" id="filter-class" onchange="loadQuestion()">
          <option value="all">All Drug Classes</option>
        </select>
        <button class="btn btn-outline" onclick="resetProgress()" style="font-size:12px; padding:0.4rem 0.8rem; margin-left:auto;">Reset Stats</button>
      </div>

      <div class="quiz-container">
        <div class="question-text" id="quiz-question"></div>
        <div class="options-grid" id="quiz-options"></div>
        
        <div id="quiz-explanation" class="explanation-box hidden"></div>

        <div style="margin-top: 2rem; display: flex; gap: 1rem;">
          <button class="btn btn-primary hidden" id="btn-next" onclick="loadQuestion()">Next Question →</button>
          <button class="btn btn-outline hidden" id="btn-reveal" onclick="openLexicon(currentDrug.id)">View Info</button>
        </div>
      </div>
    </div>

    <div id="tab-lexicon" class="tab-content hidden">
      <div class="page-header">
        <h1 class="page-title">Drug Lexicon</h1>
        <p class="page-desc">Search detailed monographs.</p>
      </div>
      <div class="control-panel">
        <input type="text" class="input-elem" id="lexicon-search" placeholder="Search..." onkeyup="renderLexiconList()">
      </div>
      <div class="lexicon-layout">
        <div class="lexicon-list" id="lexicon-list"></div>
        <div class="lexicon-detail" id="lexicon-detail">
          <div style="text-align: center; color: var(--text-muted); margin-top: 40%;">Select a drug to view details.</div>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
const DRUGS = [  {id:1,generic:"lisinopril",brand:"Prinivil, Zestril",use:"Hypertension, heart failure, post-MI",class:"ACE Inhibitor",schedule:null,notes:"Monitor for dry cough and hyperkalemia. Do not use in pregnancy.",route:"Oral"},   {id:2,generic:"enalapril",brand:"Vasotec",use:"Hypertension, heart failure",class:"ACE Inhibitor",schedule:null,notes:"Prodrug converted to enalaprilat. Same cough risk as other ACE inhibitors. Avoid in pregnancy.",route:"Oral/IV"},   {id:3,generic:"ramipril",brand:"Altace",use:"Hypertension, heart failure, post-MI, diabetic nephropathy",class:"ACE Inhibitor",schedule:null,notes:"Well-studied post-MI. Dry cough and angioedema possible.",route:"Oral"},   {id:4,generic:"benazepril",brand:"Lotensin",use:"Hypertension",class:"ACE Inhibitor",schedule:null,notes:"Prodrug. Cough side effect. Monitor renal function and potassium.",route:"Oral"},   {id:5,generic:"losartan",brand:"Cozaar",use:"Hypertension, diabetic nephropathy",class:"ARB",schedule:null,notes:"No cough (unlike ACE inhibitors). Avoid in pregnancy.",route:"Oral"},   {id:6,generic:"valsartan",brand:"Diovan",use:"Hypertension, heart failure, post-MI",class:"ARB",schedule:null,notes:"Can be used in ACE inhibitor-intolerant patients. Avoid in pregnancy.",route:"Oral"},   {id:7,generic:"olmesartan",brand:"Benicar",use:"Hypertension",class:"ARB",schedule:null,notes:"Can cause sprue-like enteropathy with long-term use.",route:"Oral"},   {id:8,generic:"irbesartan",brand:"Avapro",use:"Hypertension, diabetic nephropathy",class:"ARB",schedule:null,notes:"Renal protection in Type 2 diabetes. Avoid in pregnancy.",route:"Oral"},   {id:9,generic:"metoprolol succinate",brand:"Toprol-XL",use:"Hypertension, heart failure, angina",class:"Beta Blocker",schedule:null,notes:"Extended-release. Do not crush. Taper to discontinue. Once-daily.",route:"Oral"},   {id:10,generic:"metoprolol tartrate",brand:"Lopressor",use:"Hypertension, angina, post-MI",class:"Beta Blocker",schedule:null,notes:"Immediate-release. Twice daily. Do not stop abruptly.",route:"Oral"},   {id:11,generic:"atenolol",brand:"Tenormin",use:"Hypertension, angina, arrhythmias",class:"Beta Blocker",schedule:null,notes:"Less CNS penetration. Dose adjust in renal impairment.",route:"Oral"},   {id:12,generic:"carvedilol",brand:"Coreg",use:"Heart failure, hypertension, post-MI",class:"Alpha/Beta Blocker",schedule:null,notes:"Take with food to reduce hypotension. Non-selective — use caution in asthma/COPD.",route:"Oral"},   {id:13,generic:"propranolol",brand:"Inderal",use:"Hypertension, angina, migraine prevention, tremor",class:"Beta Blocker",schedule:null,notes:"Crosses blood-brain barrier. Masks hypoglycemia signs in diabetics.",route:"Oral"},   {id:14,generic:"bisoprolol",brand:"Zebeta",use:"Hypertension, heart failure",class:"Beta Blocker",schedule:null,notes:"High cardioselectivity. Once daily. Do not stop abruptly.",route:"Oral"},   {id:15,generic:"amlodipine",brand:"Norvasc",use:"Hypertension, angina",class:"Calcium Channel Blocker",schedule:null,notes:"Long half-life. Common side effect: peripheral edema.",route:"Oral"},   {id:16,generic:"diltiazem",brand:"Cardizem",use:"Hypertension, angina, arrhythmias",class:"Calcium Channel Blocker",schedule:null,notes:"Slows heart rate. Do not crush extended-release. CYP3A4 interactions.",route:"Oral/IV"},   {id:17,generic:"verapamil",brand:"Calan",use:"Hypertension, angina, arrhythmias",class:"Calcium Channel Blocker",schedule:null,notes:"Most potent negative chronotrope. Causes constipation. Interacts with digoxin.",route:"Oral/IV"},   {id:18,generic:"nifedipine",brand:"Procardia",use:"Hypertension, angina, Raynaud's phenomenon",class:"Calcium Channel Blocker",schedule:null,notes:"Do not crush XL form. Reflex tachycardia with immediate-release.",route:"Oral"},   {id:19,generic:"hydrochlorothiazide",brand:"Microzide",use:"Hypertension, edema",class:"Thiazide Diuretic",schedule:null,notes:"Can deplete potassium. Take in morning. Photosensitivity possible.",route:"Oral"},   {id:20,generic:"furosemide",brand:"Lasix",use:"Edema, heart failure, hypertension",class:"Loop Diuretic",schedule:null,notes:"Potent diuretic. Monitor potassium. Ototoxic at high doses.",route:"Oral/IV"},   {id:21,generic:"spironolactone",brand:"Aldactone",use:"Heart failure, hypertension, edema",class:"Potassium-Sparing Diuretic",schedule:null,notes:"Monitor potassium — can cause hyperkalemia. Gynecomastia in men.",route:"Oral"},   {id:22,generic:"chlorthalidone",brand:"Thalitone",use:"Hypertension, edema",class:"Thiazide-Like Diuretic",schedule:null,notes:"Longer-acting than HCTZ. Preferred by JNC guidelines.",route:"Oral"},   {id:23,generic:"torsemide",brand:"Demadex",use:"Edema, heart failure",class:"Loop Diuretic",schedule:null,notes:"Better oral bioavailability than furosemide. Monitor electrolytes.",route:"Oral/IV"},   {id:24,generic:"atorvastatin",brand:"Lipitor",use:"Hyperlipidemia",class:"Statin",schedule:null,notes:"Take at any time of day. Monitor for myopathy. Avoid grapefruit juice.",route:"Oral"},   {id:25,generic:"simvastatin",brand:"Zocor",use:"Hyperlipidemia",class:"Statin",schedule:null,notes:"Take in evening. 80mg dose not recommended due to myopathy risk.",route:"Oral"},   {id:26,generic:"rosuvastatin",brand:"Crestor",use:"Hyperlipidemia",class:"Statin",schedule:null,notes:"Most potent statin. Not significantly metabolized by CYP3A4.",route:"Oral"},   {id:27,generic:"pravastatin",brand:"Pravachol",use:"Hyperlipidemia",class:"Statin",schedule:null,notes:"Fewer drug interactions. Safe with grapefruit. Give at bedtime.",route:"Oral"},   {id:28,generic:"lovastatin",brand:"Mevacor",use:"Hyperlipidemia",class:"Statin",schedule:null,notes:"Must be taken with food (evening meal). Avoid grapefruit.",route:"Oral"},   {id:29,generic:"metformin",brand:"Glucophage",use:"Type 2 diabetes",class:"Biguanide",schedule:null,notes:"Take with food. Hold before contrast dye. Risk of lactic acidosis. First-line T2DM.",route:"Oral"},   {id:30,generic:"glipizide",brand:"Glucotrol",use:"Type 2 diabetes",class:"Sulfonylurea",schedule:null,notes:"Take 30 min before meal. Hypoglycemia risk. Avoid alcohol.",route:"Oral"},   {id:31,generic:"glimepiride",brand:"Amaryl",use:"Type 2 diabetes",class:"Sulfonylurea",schedule:null,notes:"Once daily with first meal. Risk of hypoglycemia.",route:"Oral"},   {id:32,generic:"glyburide",brand:"DiaBeta",use:"Type 2 diabetes",class:"Sulfonylurea",schedule:null,notes:"Highest risk of hypoglycemia among sulfonylureas. Avoid in elderly.",route:"Oral"},   {id:33,generic:"sitagliptin",brand:"Januvia",use:"Type 2 diabetes",class:"DPP-4 Inhibitor",schedule:null,notes:"Once daily. Low hypoglycemia risk when used alone.",route:"Oral"},   {id:34,generic:"pioglitazone",brand:"Actos",use:"Type 2 diabetes",class:"Thiazolidinedione",schedule:null,notes:"Edema and weight gain. Risk of heart failure. Not for CHF patients.",route:"Oral"},   {id:35,generic:"empagliflozin",brand:"Jardiance",use:"Type 2 diabetes, heart failure",class:"SGLT-2 Inhibitor",schedule:null,notes:"Causes glucosuria. Risk of UTI and genital yeast infections.",route:"Oral"},   {id:36,generic:"liraglutide",brand:"Victoza",use:"Type 2 diabetes, obesity",class:"GLP-1 Receptor Agonist",schedule:null,notes:"Inject subcutaneously. Risk of pancreatitis. Nausea common.",route:"Subcutaneous"},   {id:37,generic:"insulin glargine",brand:"Lantus",use:"Type 1 and Type 2 diabetes",class:"Long-Acting Insulin",schedule:null,notes:"Once daily at same time. Do NOT mix with other insulins. Clear solution.",route:"Subcutaneous"},   {id:38,generic:"insulin aspart",brand:"NovoLog",use:"Type 1 and Type 2 diabetes",class:"Rapid-Acting Insulin",schedule:null,notes:"Inject 5–10 min before meals. Onset ~15 min.",route:"Subcutaneous"},   {id:39,generic:"insulin lispro",brand:"Humalog",use:"Type 1 and Type 2 diabetes",class:"Rapid-Acting Insulin",schedule:null,notes:"Inject 15 min before or immediately after meals.",route:"Subcutaneous"},   {id:40,generic: let state = { questionsAnswered: 0, correctAnswers: 0, streak: 0, seen: new Set() };
let currentDrug = null;
let isAnswered = false;

function init() {
  loadState();
  populateDropdowns();
  updateDashboard();
  loadQuestion();
  renderLexiconList();
}

// Save application state variables locally inside the browser
function saveState() {
  const serializedState = {
    questionsAnswered: state.questionsAnswered,
    correctAnswers: state.correctAnswers,
    streak: state.streak,
    seen: Array.from(state.seen)
  };
  localStorage.setItem('rxmaster_progress_state', JSON.stringify(serializedState));
}

// Hydrate saved records if present inside localStorage
function loadState() {
  const saved = localStorage.getItem('rxmaster_progress_state');
  if (saved) {
    try {
      const parsed = JSON.parse(saved);
      state.questionsAnswered = parsed.questionsAnswered || 0;
      state.correctAnswers = parsed.correctAnswers || 0;
      state.streak = parsed.streak || 0;
      state.seen = new Set(parsed.seen || []);
    } catch (e) {
      console.error("Error reading stored data, starting fresh:", e);
    }
  }
}

// Allows users to clear metrics back to 0
function resetProgress() {
  if (confirm("Are you sure you want to clear your statistics and history?")) {
    localStorage.removeItem('rxmaster_progress_state');
    state = { questionsAnswered: 0, correctAnswers: 0, streak: 0, seen: new Set() };
    if (currentDrug) state.seen.add(currentDrug.id);
    updateDashboard();
    saveState();
  }
}

function switchTab(tabId, btnElement) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
  document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
  
  document.getElementById(`tab-${tabId}`).classList.remove('hidden');
  btnElement.classList.add('active');
}

function updateDashboard() {
  const acc = state.questionsAnswered === 0 ? 0 : Math.round((state.correctAnswers / state.questionsAnswered) * 100);
  const seenPct = Math.round((state.seen.size / DRUGS.length) * 100);
  document.getElementById('stat-seen').textContent = state.seen.size;
  document.getElementById('bar-seen').style.width = `${seenPct}%`;
  document.getElementById('stat-acc').textContent = `${acc}%`;
  document.getElementById('bar-acc').style.width = `${acc}%`;
  document.getElementById('stat-streak').textContent = state.streak;
  document.getElementById('bar-streak').style.width = `${Math.min(state.streak * 10, 100)}%`;
  document.getElementById('nav-quiz-cnt').textContent = state.questionsAnswered;
}

function populateDropdowns() {
  const classes = [...new Set(DRUGS.map(d => d.class))].sort();
  const filter = document.getElementById('filter-class');
  classes.forEach(c => {
    let opt = document.createElement('option');
    opt.value = c; opt.textContent = c;
    filter.appendChild(opt);
  });
}

function loadQuestion() {
  const cls = document.getElementById('filter-class').value;
  const pool = DRUGS.filter(d => cls === 'all' || d.class === cls);
  
  if(pool.length < 4) {
    document.getElementById('quiz-question').innerHTML = "Not enough drugs for these filters.";
    return;
  }
  
  isAnswered = false;
  document.getElementById('btn-next').classList.add('hidden');
  document.getElementById('btn-reveal').classList.add('hidden');
  
  // Clean explanation box
  const expBox = document.getElementById('quiz-explanation');
  expBox.classList.add('hidden');
  expBox.className = 'explanation-box';
  expBox.innerHTML = '';
  
  currentDrug = pool[Math.floor(Math.random() * pool.length)];
  state.seen.add(currentDrug.id);
  saveState();
  
  const mode = document.getElementById('filter-mode').value;
  let questionHtml = '', correctAns = '';
  
  if (mode === 'g2u') { questionHtml = `What is <strong>${currentDrug.generic}</strong> used for?`; correctAns = currentDrug.use; }
  else if (mode === 'b2g') { questionHtml = `Generic name for <strong>${currentDrug.brand}</strong>?`; correctAns = currentDrug.generic; }
  else if (mode === 'u2g') { questionHtml = `Which drug is used for: <em>${currentDrug.use}</em>?`; correctAns = currentDrug.generic; }
  else if (mode === 'c2d') { questionHtml = `Which is a <strong>${currentDrug.class}</strong>?`; correctAns = currentDrug.generic; }

  document.getElementById('quiz-question').innerHTML = questionHtml;
  
  let options = [correctAns];
  while(options.length < 4) {
    let r = pool[Math.floor(Math.random() * pool.length)];
    let w = (mode === 'g2u') ? r.use : r.generic;
    if(!options.includes(w)) options.push(w);
  }
  options.sort(() => Math.random() - 0.5);
  
  const container = document.getElementById('quiz-options');
  container.innerHTML = '';
  options.forEach(opt => {
    let btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt;
    btn.onclick = () => handleAnswer(btn, opt, correctAns);
    container.appendChild(btn);
  });
  updateDashboard();
}

function handleAnswer(btn, selected, correct) {
  if(isAnswered) return;
  isAnswered = true;
  state.questionsAnswered++;
  
  const isCorrect = (selected === correct);
  
  document.querySelectorAll('.option-btn').forEach(b => {
    b.disabled = true;
    if(b.textContent === correct) b.classList.add('correct');
    else if (b === btn && !isCorrect) b.classList.add('wrong');
  });
  
  if(isCorrect) {
    state.correctAnswers++;
    state.streak++;
  } else {
    state.streak = 0;
  }
  
  saveState();
  updateDashboard();
  
  // Handle Explanation Setup
  const expBox = document.getElementById('quiz-explanation');
  expBox.classList.remove('hidden');
  if(isCorrect) {
    expBox.classList.add('correct-wrap');
    expBox.innerHTML = `
      <div class="explanation-title">✨ Correct!</div>
      <div class="explanation-text"><strong>${currentDrug.generic}</strong> (${currentDrug.brand}) is classified as a <strong>${currentDrug.class}</strong>, primarily indicated for: <em>${currentDrug.use}</em>.<br><small><strong>Notes:</strong> ${currentDrug.notes || 'N/A'}</small></div>
    `;
  } else {
    expBox.classList.add('wrong-wrap');
    expBox.innerHTML = `
      <div class="explanation-title">❌ Incorrect</div>
      <div class="explanation-text">The right answer was <strong>${correct}</strong>. <strong>${currentDrug.generic}</strong> (${currentDrug.brand}) belongs to the <strong>${currentDrug.class}</strong> family and is used for <em>${currentDrug.use}</em>.<br><small><strong>Clinical Notes:</strong> ${currentDrug.notes || 'N/A'}</small></div>
    `;
  }
  
  document.getElementById('btn-next').classList.remove('hidden');
  document.getElementById('btn-reveal').classList.remove('hidden');
}

function renderLexiconList() {
  const query = document.getElementById('lexicon-search').value.toLowerCase();
  const list = document.getElementById('lexicon-list');
  list.innerHTML = '';
  DRUGS.filter(d => d.generic.includes(query) || d.brand.toLowerCase().includes(query)).forEach(d => {
    let div = document.createElement('div');
    div.className = 'lexicon-item';
    div.innerHTML = `<strong>${d.generic}</strong><br><small>${d.brand}</small>`;
    div.onclick = () => renderLexiconDetail(d, div);
    list.appendChild(div);
  });
}

function renderLexiconDetail(drug, element) {
  document.querySelectorAll('.lexicon-item').forEach(el => el.classList.remove('active'));
  if(element) element.classList.add('active');
  document.getElementById('lexicon-detail').innerHTML = `
    <h2>${drug.generic}</h2>
    <p>Brands: ${drug.brand}</p>
    <span class="detail-tag tag-class">${drug.class}</span>
    <div class="info-box">${drug.notes}</div>
  `;
}

function openLexicon(id) {
  const drug = DRUGS.find(d => d.id === id);
  switchTab('lexicon', document.querySelectorAll('.nav-btn')[1]);
  renderLexiconDetail(drug, null);
}

init();
</script>
